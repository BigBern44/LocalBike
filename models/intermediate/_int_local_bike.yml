version: 2

models:

  - name: int_order_items_enriched
    description: >
      Lignes de commande enrichies (grain = order_id + item_id). Joint
      `stg_order_items` au produit, à sa marque et à sa catégorie, puis calcule
      le revenu de la ligne :
      `revenue = round(quantity * list_price * (1 - discount), 2)`.
      Couche pivot consommée par `fct_order_items` (clés + mesures) et
      `fct_orders` (agrégation du revenu par commande).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, item_id]
    columns:
      - name: order_id
        description: Identifiant de la commande (1re partie du grain).
        tests: [not_null]
      - name: item_id
        description: Numéro de ligne dans la commande (2e partie du grain).
        tests: [not_null]
      - name: product_id
        description: Clé étrangère vers le produit.
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: brand_id
        description: Clé étrangère vers la marque (résolue via le produit).
      - name: category_id
        description: Clé étrangère vers la catégorie (résolue via le produit).
      - name: product_name
        description: Nom commercial du produit.
      - name: model_year
        description: Année du modèle.
      - name: brand_name
        description: Nom de la marque.
      - name: category_name
        description: Nom de la catégorie.
      - name: quantity
        description: Quantité commandée (> 0).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: list_price
        description: Prix catalogue unitaire de la ligne.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: discount
        description: Remise appliquée à la ligne (entre 0 et 1).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
      - name: revenue
        description: "Revenu de la ligne : quantity * list_price * (1 - discount), arrondi à 2 décimales."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

# ---------------------------------------------------------------------------
# Unit tests — scénarios S-06 à S-09 du cahier de recettes
# (cf. recette/scenarios/structurels.md).
#
# Différence de nature avec les tests ci-dessus et avec ceux de `tests/` : ceux-là
# valident la DONNÉE réellement produite, ceux-ci valident la LOGIQUE SQL sur des
# entrées choisies. Ils s'exécutent sans dépendre du contenu de l'entrepôt et
# détectent une régression au moment où le modèle est modifié — avant même la
# prochaine ingestion.
#
# Seules les colonnes listées dans `expect` sont comparées.
# ---------------------------------------------------------------------------
unit_tests:

  - name: revenue_applique_la_remise
    description: >
      S-06 — Cas nominal : 2 × 100,00 € remisés de 10 % donnent 180,00 €.
      Verrouille la formule `quantity * list_price * (1 - discount)` contre une
      inversion de la remise (qui donnerait 20,00 €) ou son oubli (200,00 €).
    model: int_order_items_enriched
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, item_id: 1, product_id: 10, quantity: 2, list_price: 100.00, discount: 0.10}
      - input: ref('stg_products')
        rows:
          - {product_id: 10, product_name: 'Vélo de test', brand_id: 1, category_id: 1, model_year: 2026, list_price: 100.00}
      - input: ref('stg_brands')
        rows:
          - {brand_id: 1, brand_name: 'Marque de test'}
      - input: ref('stg_categories')
        rows:
          - {category_id: 1, category_name: 'Catégorie de test'}
    expect:
      rows:
        - {order_id: 1, item_id: 1, product_name: 'Vélo de test', brand_name: 'Marque de test', category_name: 'Catégorie de test', revenue: 180.00}

  - name: revenue_bornes_de_remise
    description: >
      S-07 — Les deux bornes admises par le test `accepted_range` de la couche
      staging : remise nulle (le revenu vaut le prix catalogue × quantité) et
      remise totale (le revenu s'annule, sans devenir négatif ni null).
    model: int_order_items_enriched
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, item_id: 1, product_id: 10, quantity: 3, list_price: 50.00, discount: 0.00}
          - {order_id: 1, item_id: 2, product_id: 10, quantity: 3, list_price: 50.00, discount: 1.00}
      - input: ref('stg_products')
        rows:
          - {product_id: 10, product_name: 'Vélo de test', brand_id: 1, category_id: 1, model_year: 2026, list_price: 50.00}
      - input: ref('stg_brands')
        rows:
          - {brand_id: 1, brand_name: 'Marque de test'}
      - input: ref('stg_categories')
        rows:
          - {category_id: 1, category_name: 'Catégorie de test'}
    expect:
      rows:
        - {order_id: 1, item_id: 1, revenue: 150.00}
        - {order_id: 1, item_id: 2, revenue: 0.00}

  - name: revenue_arrondi_deux_decimales
    description: >
      S-08 — 3 × 33,33 € remisés de 15 % donnent 84,9915 € avant arrondi.
      Le modèle doit rendre 84,99 : c'est cette troncature à 2 décimales qui rend
      la somme des lignes réconciliable avec `fct_orders.total_revenue`
      (test singulier `assert_order_revenue_reconciliation`).
    model: int_order_items_enriched
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, item_id: 1, product_id: 10, quantity: 3, list_price: 33.33, discount: 0.15}
      - input: ref('stg_products')
        rows:
          - {product_id: 10, product_name: 'Vélo de test', brand_id: 1, category_id: 1, model_year: 2026, list_price: 33.33}
      - input: ref('stg_brands')
        rows:
          - {brand_id: 1, brand_name: 'Marque de test'}
      - input: ref('stg_categories')
        rows:
          - {category_id: 1, category_name: 'Catégorie de test'}
    expect:
      rows:
        - {order_id: 1, item_id: 1, revenue: 84.99}

  - name: revenue_ligne_sans_produit_rattache
    description: >
      S-09 — Une ligne dont le produit est absent du référentiel doit être
      CONSERVÉE (jointure `left join`), son revenu calculé à partir du prix porté
      par la ligne de commande, et ses attributs produit laissés à null. Le revenu
      total ne doit jamais dépendre de la complétude du référentiel produits :
      basculer ce `left join` en `inner join` ferait disparaître du chiffre
      d'affaires du dashboard sans qu'aucun test de données ne le signale.
    model: int_order_items_enriched
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, item_id: 1, product_id: 999, quantity: 2, list_price: 25.00, discount: 0.00}
      - input: ref('stg_products')
        rows:
          - {product_id: 10, product_name: 'Vélo de test', brand_id: 1, category_id: 1, model_year: 2026, list_price: 100.00}
      - input: ref('stg_brands')
        rows:
          - {brand_id: 1, brand_name: 'Marque de test'}
      - input: ref('stg_categories')
        rows:
          - {category_id: 1, category_name: 'Catégorie de test'}
    expect:
      rows:
        - {order_id: 1, item_id: 1, product_id: 999, product_name: null, brand_name: null, category_name: null, revenue: 50.00}
