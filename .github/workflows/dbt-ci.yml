name: dbt CI

# Relance les tests dbt :
#   - sur chaque Pull Request vers main  -> vérifie AVANT le merge
#   - sur chaque push/merge sur main      -> vérifie l'état final de main
# `dbt build` = run des modèles + exécution des tests (génériques + singuliers) :
# les tests dépendent des modèles, on les reconstruit donc avant de tester,
# contre les données brutes déjà ingérées.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi un lancement manuel depuis l'onglet Actions

# Une exécution par ref : un nouveau commit sur une PR annule le run en cours
# de cette PR ; les runs sur main ne s'annulent pas (ils se mettent en file
# pour éviter deux builds concurrents sur les datasets BigQuery).
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: dbt build (run + test)
    runs-on: ubuntu-latest

    env:
      # profiles.yml est à la racine du repo ; pas besoin de --profiles-dir .
      DBT_PROFILES_DIR: ${{ github.workspace }}
      # Variables lues par profiles.yml via env_var(...)
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'EU' }}
      # github.workspace (pas runner.temp : le contexte runner n'est pas
      # disponible dans un env de niveau job). gcp-sa.json est gitignoré (*-sa.json).
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dbt-bigquery
        # Aligné sur le pin de requirements.txt ; on n'installe que dbt
        # (pas polars/dagster) pour une CI rapide.
        run: uv pip install --system "dbt-bigquery~=1.9"

      - name: Write BigQuery service account key
        # Le JSON du service account est stocké dans le secret GCP_SA_KEY.
        # Heredoc 'EOF' (quoté) : le shell n'interprète pas le contenu JSON.
        run: |
          cat <<'EOF' > "$GOOGLE_APPLICATION_CREDENTIALS"
          ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Install dbt packages (dbt_utils)
        run: dbt deps

      - name: Check BigQuery connection
        run: dbt debug --target ci

      - name: dbt build (run models + run tests)
        # --target ci : écrit dans les datasets local_bike_ci_* (isolés de la prod).
        run: dbt build --target ci

      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
