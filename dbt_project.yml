name: 'local_bike'
version: '1.0.0'
config-version: 2

profile: 'local_bike'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Variables de la couche supervision (models/monitoring).
vars:
  # Dataset brut interrogé pour les métadonnées techniques (__TABLES__, _dlt_loads).
  raw_dataset: local_bike_raw
  # SLA de fraîcheur des tables brutes : 24 h de cycle + 2 h de marge (durée du run,
  # retard de schedule). Au-delà, `mon_raw_freshness.is_stale` déclenche l'alerte Grafana.
  raw_freshness_sla_hours: 26

models:
  local_bike:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      reporting:
        +materialized: table
        +schema: reporting
    # Couche supervision -> dataset local_bike_monitoring, lue par Grafana.
    # En **vue** : une table figerait les indicateurs à la dernière exécution de dbt,
    # c'est-à-dire au moment où le pipeline allait bien.
    monitoring:
      +materialized: view
      +schema: monitoring
